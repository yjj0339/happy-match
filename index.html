<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>萌宠消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#1a5c1a;color:#fff}
#game{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;touch-action:manipulation}
.screen.active{display:flex}

/* Menu */
#menu-screen{justify-content:center;gap:16px;background:#1a5c1a}
.logo{font-size:42px;font-weight:900;color:#ffeb3b;text-shadow:0 3px 0 #0d3d0d,0 5px 8px rgba(0,0,0,.4);letter-spacing:3px}
.subtitle{font-size:14px;opacity:.7}
.menu-animals{font-size:36px;letter-spacing:6px}
.btn{padding:14px 44px;font-size:18px;font-weight:700;border:none;border-radius:30px;color:#fff;cursor:pointer;touch-action:manipulation;background:#5cb85c;box-shadow:0 4px 0 #3d8b3d;outline:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3d8b3d}
.btn-blue{background:#5bc0de;box-shadow:0 4px 0 #3197b3}
.btn-blue:active{box-shadow:0 1px 0 #3197b3}
.btn-orange{background:#f0ad4e;box-shadow:0 4px 0 #c4862e}
.btn-orange:active{box-shadow:0 1px 0 #c4862e}
.btn-red{background:#d9534f;box-shadow:0 4px 0 #a83632}
.btn-red:active{box-shadow:0 1px 0 #a83632}
.btn-small{padding:8px 18px;font-size:14px}

/* Map */
#map-screen{background:#1a5c1a}
.map-header{width:100%;padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);flex-shrink:0}
.map-header h2{font-size:18px;flex:1;text-align:center}
#map-container{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#vine-svg{position:absolute;top:0;left:0;pointer-events:none}
.level-node{position:absolute;width:56px;height:56px;transform:translate(-50%,-50%);cursor:pointer;touch-action:manipulation}
.level-circle{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);background:#5cb85c;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.level-node:active .level-circle{transform:scale(.9)}
.level-node.locked .level-circle{background:#777;opacity:.5}
.level-node.locked .level-circle span{display:none}
.level-node.locked .level-circle::after{content:'🔒';font-size:22px}
.level-stars{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap}

/* Game */
#game-screen{background:#1a5c1a}
.game-header{width:100%;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.back-btn{font-size:20px;padding:4px 10px;background:rgba(0,0,0,.25);border:none;color:#fff;border-radius:8px;cursor:pointer;touch-action:manipulation}
.info-pill{background:rgba(0,0,0,.25);padding:4px 12px;border-radius:16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px}
.info-pill .label{opacity:.6;font-size:11px}
.info-pill .value{font-size:15px;color:#ffeb3b}
.objective-bar{padding:4px 10px;flex-shrink:0}
.objective-text{font-size:12px;text-align:center;margin-bottom:3px;opacity:.85}
.progress-bar{height:6px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#ffeb3b;border-radius:3px;transition:width .4s;width:0%}
#board-container{display:flex;justify-content:center;align-items:center;flex:1;width:100%;min-height:0}
#board{position:relative;background:rgba(0,0,0,.2);border-radius:10px;padding:6px;touch-action:none}

/* Tiles */
.tile{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.tile-bg{position:absolute;inset:2px;border-radius:20%}
.tile-emoji{position:relative;z-index:2}
.tile.selected .tile-bg{box-shadow:0 0 0 3px #fff}
.tile.eliminating{pointer-events:none}
.tile.special-bomb .tile-bg::after,.tile.special-rainbow .tile-bg::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3}
.tile.special-bomb .tile-bg::after{content:'💥'}
.tile.special-rainbow .tile-bg::after{content:'🌈'}
.tile.special-bomb .tile-emoji,.tile.special-rainbow .tile-emoji{opacity:0}
.t0 .tile-bg{background:#D4A373}.t1 .tile-bg{background:#FFE066}.t2 .tile-bg{background:#90EE90}
.t3 .tile-bg{background:#FFB347}.t4 .tile-bg{background:#87CEEB}.t5 .tile-bg{background:#DDA0DD}

/* Powerups */
.powerup-bar{display:flex;gap:10px;padding:8px;flex-shrink:0;justify-content:center}
.powerup-btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:22px;touch-action:manipulation}
.powerup-btn:active{transform:scale(.9)}
.powerup-btn .count{position:absolute;bottom:-2px;right:-2px;background:#d9534f;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.powerup-btn.active{background:rgba(255,235,59,.3);border-color:#ffeb3b}
.powerup-btn.disabled{opacity:.35}

/* Modals */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:28px 32px;text-align:center;max-width:88%;width:300px;color:#333}
.modal-content h2{font-size:22px;margin-bottom:14px}
.modal-content .info-row{font-size:14px;margin:6px 0;color:#888}
.modal-content .info-row b{color:#333}
.modal-buttons{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.stars-container{display:flex;justify-content:center;gap:8px;margin:12px 0}
.star{font-size:32px;opacity:.15;transition:all .3s}
.star.filled{opacity:1}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15px}
.setting-row input{width:40px;height:22px}
#combo-text{position:absolute;font-size:28px;font-weight:900;pointer-events:none;z-index:50;color:#ffeb3b;text-shadow:0 2px 0 rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-50%)}
#combo-text.show{animation:cb .8s ease-out}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-120%) scale(.8)}}
#score-popup{position:absolute;font-size:16px;font-weight:900;color:#ffeb3b;pointer-events:none;z-index:40;text-shadow:0 1px 2px rgba(0,0,0,.5);opacity:0}
#score-popup.show{animation:sp .8s ease-out}
@keyframes sp{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:30}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,0)}75%{transform:translate(3px,0)}}
@media(max-width:380px){.logo{font-size:34px}.btn{padding:12px 36px;font-size:16px}}
</style>
</head>
<body>
<div id="game">
  <div id="menu-screen" class="screen active">
    <div class="menu-animals">🐻🐥🐸🦊🐘🐼</div>
    <div class="logo">萌宠消消乐</div>
    <div class="subtitle">可爱动物消除大作战</div>
    <button class="btn" id="play-btn" style="margin-top:10px">开始游戏</button>
    <button class="btn btn-blue btn-small" id="settings-btn">设置</button>
  </div>

  <div id="map-screen" class="screen">
    <div class="map-header">
      <button class="btn btn-orange btn-small" id="map-back-btn">← 返回</button>
      <h2>选择关卡</h2>
      <div style="width:50px"></div>
    </div>
    <div id="map-container">
      <svg id="vine-svg"></svg>
      <div id="level-nodes"></div>
    </div>
  </div>

  <div id="game-screen" class="screen">
    <div class="game-header">
      <button class="back-btn" id="game-back-btn">←</button>
      <div class="info-pill"><span class="label">关卡</span><span class="value" id="level-num">1</span></div>
      <div class="info-pill"><span class="label">分数</span><span class="value" id="score">0</span></div>
      <div class="info-pill"><span class="label">步数</span><span class="value" id="moves">30</span></div>
    </div>
    <div class="objective-bar" style="width:var(--board-width,320px)">
      <div class="objective-text" id="objective-text">目标分数: 1200</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="board-container"><div id="board"></div></div>
    <div class="powerup-bar">
      <div class="powerup-btn" id="hammer-btn">🔨<span class="count" id="hammer-count">3</span></div>
      <div class="powerup-btn" id="shuffle-btn">🔀<span class="count" id="shuffle-count">1</span></div>
    </div>
  </div>

  <div class="modal" id="level-info-modal">
    <div class="modal-content">
      <h2 id="info-level-title">第 1 关</h2>
      <div class="info-row" id="info-objective">目标: 达到 1200 分</div>
      <div class="info-row">步数限制: <b id="info-moves">30</b> 步</div>
      <div class="info-row">最高分: <b id="info-best">-</b></div>
      <div class="modal-buttons">
        <button class="btn" id="info-start-btn">开始</button>
        <button class="btn btn-orange btn-small" id="info-close-btn">返回</button>
      </div>
    </div>
  </div>

  <div class="modal" id="complete-modal">
    <div class="modal-content">
      <h2>🎉 恭喜过关！</h2>
      <div class="stars-container"><span class="star" id="star1">⭐</span><span class="star" id="star2">⭐</span><span class="star" id="star3">⭐</span></div>
      <div class="info-row">得分: <b id="complete-score">0</b></div>
      <div class="info-row">最高分: <b id="complete-best">0</b></div>
      <div class="modal-buttons">
        <button class="btn" id="next-level-btn">下一关</button>
        <button class="btn btn-orange btn-small" id="replay-btn">重玩</button>
        <button class="btn btn-blue btn-small" id="complete-map-btn">返回地图</button>
      </div>
    </div>
  </div>

  <div class="modal" id="failed-modal">
    <div class="modal-content">
      <h2>😢 再接再厉！</h2>
      <div class="info-row">得分: <b id="failed-score">0</b></div>
      <div class="modal-buttons">
        <button class="btn" id="retry-btn">重试</button>
        <button class="btn btn-blue btn-small" id="failed-map-btn">返回地图</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h2>设置</h2>
      <div class="setting-row"><span>音效</span><input type="checkbox" id="sound-toggle" checked></div>
      <div class="setting-row"><span>背景音乐</span><input type="checkbox" id="music-toggle" checked></div>
      <div class="modal-buttons">
        <button class="btn btn-red btn-small" id="reset-progress-btn">重置进度</button>
        <button class="btn btn-small" id="settings-close-btn">关闭</button>
      </div>
    </div>
  </div>

  <div id="combo-text"></div>
  <div id="score-popup"></div>
</div>

<script>
var EMOJIS=['🐻','🐥','🐸','🦊','🐘','🐼'];
var PCOLORS=['#D4A373','#FFE066','#90EE90','#FFB347','#87CEEB','#DDA0DD'];
var COMBO_T=['','消除!','连击!','太棒了!','超棒!','Amazing!','太强了!','无敌!','神级!','逆天!'];
var TOTAL=30;
var LEVELS=[];
for(var i=1;i<=TOTAL;i++){
  var ph=Math.ceil(i/5);
  var tt=Math.min(4+Math.floor(i/4),6);
  var mv=Math.max(30-Math.floor(i*.5),15);
  var bs=800+i*400;
  var obj=(i%5===0)?{type:'collect',tileType:((i/5-1)%6),target:12+i}:{type:'score',target:bs};
  LEVELS.push({level:i,rows:8,cols:8,tileTypes:tt,moves:mv,objective:obj,starScores:[bs,Math.floor(bs*1.5),Math.floor(bs*2)]});
}

var S={screen:'menu',level:1,score:0,moves:0,combo:0,maxCombo:0,board:[],rows:8,cols:8,tileTypes:6,selected:null,isProcessing:false,powerups:{hammer:3,shuffle:1},hammerMode:false,unlockedLevel:1,stars:{},highScores:{},objective:null,collected:{},soundEnabled:true,musicEnabled:true,musicOsc:null};
var nextId=0;

function $(id){return document.getElementById(id)}
var boardEl=$('board');

// Sound
var Sound={ctx:null,init:function(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},play:function(t,p){if(!S.soundEnabled||!this.ctx)return;var c=this.ctx;if(c.state==='suspended')c.resume();p=p||{};switch(t){case'pop':this._t(300+Math.random()*200,.08,'sine',.2);break;case'swap':this._t(500,.04,'square',.1);break;case'combo':var b=400+(p.combo||1)*80;this._t(b,.12,'sine',.25);this._t(b*1.5,.1,'sine',.15);break;case'special':this._t(600,.05,'sawtooth',.15);var s=this;setTimeout(function(){s._t(900,.1,'sine',.2)},50);break;case'win':[523,659,784,1047].forEach(function(f,i){var s2=s;setTimeout(function(){s2._t(f,.2,'sine',.25)},i*120)});break;case'lose':[400,350,300,250].forEach(function(f,i){var s3=s;setTimeout(function(){s3._t(f,.2,'sine',.2)},i*120)});break;case'click':this._t(800,.03,'square',.1);break;case'star':this._t(880,.15,'sine',.2);break}},_t:function(f,d,t,v){var c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}};

// Music
var Music={ctx:null,interval:null,notes:[523,587,659,587,523,659,784,659,523,587,659,784,880,784,659,587],idx:0,start:function(){if(!S.musicEnabled)return;this.stop();if(!Sound.ctx)return;this.ctx=Sound.ctx;var self=this;this.interval=setInterval(function(){if(!S.musicEnabled||!self.ctx)return;var f=self.notes[self.idx%self.notes.length];var o=self.ctx.createOscillator(),g=self.ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,self.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,self.ctx.currentTime+.3);o.connect(g);g.connect(self.ctx.destination);o.start();o.stop(self.ctx.currentTime+.3);self.idx++},350)},stop:function(){if(this.interval){clearInterval(this.interval);this.interval=null}}};

// Storage
var Storage={KEY:'happy-match-v2',save:function(){try{localStorage.setItem(this.KEY,JSON.stringify({unlockedLevel:S.unlockedLevel,stars:S.stars,highScores:S.highScores,powerups:S.powerups,soundEnabled:S.soundEnabled,musicEnabled:S.musicEnabled}))}catch(e){}},load:function(){try{var d=JSON.parse(localStorage.getItem(this.KEY));if(d){S.unlockedLevel=d.unlockedLevel||1;S.stars=d.stars||{};S.highScores=d.highScores||{};S.powerups=d.powerups||{hammer:3,shuffle:1};S.soundEnabled=d.soundEnabled!==false;S.musicEnabled=d.musicEnabled!==false}}catch(e){}},reset:function(){localStorage.removeItem(this.KEY);S.unlockedLevel=1;S.stars={};S.highScores={};S.powerups={hammer:3,shuffle:1}}};

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function tileW(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'))||40}

function updateBoardSize(){
  var pw=12,ph=120,ts;
  var aw=window.innerWidth-pw*2;
  var ah=window.innerHeight-ph-80;
  var bs=Math.min(aw,ah,440);
  ts=Math.floor(bs/S.cols);
  document.documentElement.style.setProperty('--tile-size',ts+'px');
  document.documentElement.style.setProperty('--board-width',(ts*S.cols+12)+'px');
  document.documentElement.style.setProperty('--board-height',(ts*S.rows+12)+'px');
  if(S.board.length>0)renderPositions();
}

function initBoard(){
  var lv=LEVELS[S.level-1];
  S.rows=lv.rows;S.cols=lv.cols;S.tileTypes=lv.tileTypes;S.board=[];
  for(var r=0;r<S.rows;r++){
    S.board[r]=[];
    for(var c=0;c<S.cols;c++){
      var tp;
      do{tp=Math.floor(Math.random()*S.tileTypes)}while(
        (c>=2&&S.board[r][c-1]&&S.board[r][c-1].type===tp&&S.board[r][c-2]&&S.board[r][c-2].type===tp)||
        (r>=2&&S.board[r-1]&&S.board[r-1][c]&&S.board[r-1][c].type===tp&&S.board[r-2]&&S.board[r-2][c]&&S.board[r-2][c].type===tp)
      );
      S.board[r][c]={type:tp,id:nextId++,special:null};
    }
  }
}

function renderBoard(){
  boardEl.innerHTML='';
  var ts=tileW();
  for(var r=0;r<S.rows;r++){
    for(var c=0;c<S.cols;c++){
      var t=S.board[r][c];
      if(!t)continue;
      var el=document.createElement('div');
      el.className='tile t'+t.type+(t.special?(' special-'+t.special):'');
      el.style.width=ts+'px';el.style.height=ts+'px';
      el.style.transform='translate('+(c*ts+6)+'px,'+(r*ts+6)+'px)';
      el.style.fontSize=Math.floor(ts*.55)+'px';
      el.innerHTML='<div class="tile-bg"></div><div class="tile-emoji">'+(t.special==='bomb'?'':t.special==='rainbow'?'':EMOJIS[t.type])+'</div>';
      el.dataset.r=r;el.dataset.c=c;
      t.el=el;
      boardEl.appendChild(el);
    }
  }
}

function renderPositions(){
  var ts=tileW();
  for(var r=0;r<S.rows;r++)for(var c=0;c<S.cols;c++){
    var t=S.board[r][c];
    if(t&&t.el){t.el.style.width=ts+'px';t.el.style.height=ts+'px';t.el.style.fontSize=Math.floor(ts*.55)+'px';t.el.style.transform='translate('+(c*ts+6)+'px,'+(r*ts+6)+'px)'}
  }
}

function findMatches(){
  var matches=[];
  // Horizontal
  for(var r=0;r<S.rows;r++){
    var run=[{r:r,c:0}];
    for(var c=1;c<S.cols;c++){
      if(S.board[r][c]&&S.board[r][run[0].c]&&S.board[r][c].type===S.board[r][run[0].c].type){run.push({r:r,c:c})}
      else{if(run.length>=3)matches.push(run);run=[{r:r,c:c}]}
    }
    if(run.length>=3)matches.push(run);
  }
  // Vertical
  for(var c=0;c<S.cols;c++){
    var run2=[{r:0,c:c}];
    for(var r=1;r<S.rows;r++){
      if(S.board[r][c]&&S.board[run2[0].r][c]&&S.board[r][c].type===S.board[run2[0].r][c].type){run2.push({r:r,c:c})}
      else{if(run2.length>=3)matches.push(run2);run2=[{r:r,c:c}]}
    }
    if(run2.length>=3)matches.push(run2);
  }
  return matches;
}

function mergeMatches(matches){
  var groups=[],posToGroup={};
  matches.forEach(function(m){
    var gids=[];
    m.forEach(function(p){var k=p.r+','+p.c;if(posToGroup[k]!==undefined&&gids.indexOf(posToGroup[k])<0)gids.push(posToGroup[k])});
    var gid;
    if(gids.length>0){gid=gids[0];for(var i=1;i<gids.length;i++){groups[gid]=groups[gid].concat(groups[gids[i]]);groups[gids[i]]=[]}}
    else{gid=groups.length;groups.push([])}
    m.forEach(function(p){var k=p.r+','+p.c;if(posToGroup[k]===undefined){posToGroup[k]=gid;groups[gid].push(p)}})
  });
  return groups.filter(function(g){return g.length>0});
}

function detSpecial(group){
  if(group.length<4)return null;
  if(group.length>=5){
    var rows={},cols={};
    group.forEach(function(p){rows[p.r]=1;cols[p.c]=1});
    if(Object.keys(rows).length>1&&Object.keys(cols).length>1)return'rainbow';
    return'rainbow';
  }
  if(group.length===4){
    var r2={},c2={};
    group.forEach(function(p){r2[p.r]=1;c2[p.c]=1});
    return Object.keys(r2).length===1?'striped-h':'striped-v';
  }
  return null;
}

function getMatchedTiles(matches,groups){
  var matched={};
  matches.forEach(function(m){m.forEach(function(p){matched[p.r+','+p.c]=true})});
  groups.forEach(function(g){g.forEach(function(p){
    var k=p.r+','+p.c;
    if(!matched[k]){
      var t=S.board[p.r][p.c];
      if(t&&t.special==='bomb'){
        for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
          var nr=p.r+dr,nc=p.c+dc;
          if(nr>=0&&nr<S.rows&&nc>=0&&nc<S.cols)matched[nr+','+nc]=true;
        }
      }else if(t&&t.special==='striped-h'){
        for(var c=0;c<S.cols;c++)matched[p.r+','+c]=true;
      }else if(t&&t.special==='striped-v'){
        for(var r=0;r<S.rows;r++)matched[r+','+p.c]=true;
      }else if(t&&t.special==='rainbow'){
        var tt=t.type;
        for(var r=0;r<S.rows;r++)for(var c=0;c<S.cols;c++){
          if(S.board[r][c]&&S.board[r][c].type===tt)matched[r+','+c]=true;
        }
      }
    }
  })});
  return matched;
}

async function eliminate(matched){
  var ts=tileW();
  var count=0;
  for(var k in matched){
    var parts=k.split(',');var r=+parts[0],c=+parts[1];
    var t=S.board[r][c];
    if(!t)continue;
    if(S.objective.type==='collect'&&t.type===S.objective.tileType)S.collected[t.type]=(S.collected[t.type]||0)+1;
    if(t.el){
      t.el.style.opacity='0';
      t.el.style.transform='translate('+(c*ts+6)+'px,'+(r*ts+6)+'px) scale(0)';
      // Particles
      var color=PCOLORS[t.type];
      for(var i=0;i<3;i++){
        var p=document.createElement('div');
        p.className='particle';
        var sz=5+Math.random()*3;
        p.style.cssText='width:'+sz+'px;height:'+sz+'px;background:'+color+';left:'+(c*ts+ts/2)+'px;top:'+(r*ts+ts/2)+'px';
        var ang=Math.PI*2*i/3+Math.random()*.5,dist=15+Math.random()*15;
        p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
        p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
        p.style.animation='particleFly .4s ease-out forwards';
        p.style.transform='translate(0,0)';
        boardEl.appendChild(p);
        (function(pp){setTimeout(function(){pp.remove()},400)})(p);
      }
    }
    S.board[r][c]=null;
    count++;
  }
  S.score+=count*10*S.combo;
  Sound.play('pop');
  await wait(280);
}

async function dropAndFill(){
  var ts=tileW();
  for(var c=0;c<S.cols;c++){
    var stack=[];
    for(var r=S.rows-1;r>=0;r--){
      if(S.board[r][c])stack.push(S.board[r][c]);
    }
    for(var r=S.rows-1;r>=0;r--){
      var idx=S.rows-1-r;
      if(idx<stack.length){
        S.board[r][c]=stack[idx];
        if(S.board[r][c].el)S.board[r][c].el.style.transform='translate('+(c*ts+6)+'px,'+(r*ts+6)+'px)';
      }else{
        var tp=Math.floor(Math.random()*S.tileTypes);
        S.board[r][c]={type:tp,id:nextId++,special:null};
        var el=document.createElement('div');
        el.className='tile t'+tp;
        el.style.width=ts+'px';el.style.height=ts+'px';
        el.style.transform='translate('+(c*ts+6)+'px,'+(-ts*2)+'px)';
        el.style.fontSize=Math.floor(ts*.55)+'px';
        el.innerHTML='<div class="tile-bg"></div><div class="tile-emoji">'+EMOJIS[tp]+'</div>';
        el.dataset.r=r;el.dataset.c=c;
        S.board[r][c].el=el;
        boardEl.appendChild(el);
        (function(elm,rr,cc){setTimeout(function(){elm.style.transform='translate('+(cc*ts+6)+'px,'+(rr*ts+6)+'px)'},20)})(el,r,c);
      }
    }
  }
  await wait(300);
}

async function processCascade(){
  S.combo=0;
  while(true){
    var matches=findMatches();
    if(matches.length===0)break;
    S.combo++;
    if(S.combo>1){Sound.play('combo',{combo:S.combo});showCombo(S.combo)}
    var groups=mergeMatches(matches);
    var specials={};
    groups.forEach(function(g){
      var sp=detSpecial(g);
      if(sp){var mid=g[Math.floor(g.length/2)];specials[mid.r+','+mid.c]={special:sp,type:S.board[mid.r][mid.c].type}}
    });
    var matched=getMatchedTiles(matches,groups);
    // Don't eliminate where we'll place specials
    for(var k in specials)delete matched[k];
    await eliminate(matched);
    // Place specials
    for(var k in specials){
      var parts=k.split(',');var r=+parts[0],c=+parts[1];
      var info=specials[k];
      var old=S.board[r][c];
      if(old&&old.el){
        old.el.className='tile t'+info.type+' special-'+info.special;
        old.el.innerHTML='<div class="tile-bg"></div><div class="tile-emoji">'+EMOJIS[info.type]+'</div>';
      }
      if(S.board[r][c]){S.board[r][c].special=info.special}
    }
    await dropAndFill();
  }
  S.maxCombo=Math.max(S.maxCombo,S.combo);
}

function showCombo(combo){
  var el=$('combo-text');
  var ts=tileW();
  el.style.left=(S.cols*ts/2+6)+'px';
  el.style.top=(S.rows*ts/2+6)+'px';
  el.textContent=COMBO_T[Math.min(combo,COMBO_T.length-1)]||('连击 x'+combo+'!');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function showScorePopup(score,pos){
  if(!pos)return;
  var el=$('score-popup');
  var ts=tileW();
  el.style.left=(pos.col*ts+ts/2)+'px';
  el.style.top=(pos.row*ts)+'px';
  el.textContent='+'+score;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

async function trySwap(r1,c1,r2,c2){
  if(r2<0||r2>=S.rows||c2<0||c2>=S.cols)return;
  if(S.isProcessing)return;
  S.isProcessing=true;
  // Swap in board
  var tmp=S.board[r1][c1];
  S.board[r1][c1]=S.board[r2][c2];
  S.board[r2][c2]=tmp;
  // Animate
  var ts=tileW();
  if(S.board[r1][c1]&&S.board[r1][c1].el)S.board[r1][c1].el.style.transform='translate('+(c1*ts+6)+'px,'+(r1*ts+6)+'px)';
  if(S.board[r2][c2]&&S.board[r2][c2].el)S.board[r2][c2].el.style.transform='translate('+(c2*ts+6)+'px,'+(r2*ts+6)+'px)';
  Sound.play('swap');
  S.board[r1][c1].el.dataset.r=r1;S.board[r1][c1].el.dataset.c=c1;
  S.board[r2][c2].el.dataset.r=r2;S.board[r2][c2].el.dataset.c=c2;
  await wait(200);
  var matches=findMatches();
  if(matches.length===0){
    // Swap back
    var tmp2=S.board[r1][c1];S.board[r1][c1]=S.board[r2][c2];S.board[r2][c2]=tmp2;
    if(S.board[r1][c1]&&S.board[r1][c1].el)S.board[r1][c1].el.style.transform='translate('+(c1*ts+6)+'px,'+(r1*ts+6)+'px)';
    if(S.board[r2][c2]&&S.board[r2][c2].el)S.board[r2][c2].el.style.transform='translate('+(c2*ts+6)+'px,'+(r2*ts+6)+'px)';
    S.board[r1][c1].el.dataset.r=r1;S.board[r1][c1].el.dataset.c=c1;
    S.board[r2][c2].el.dataset.r=r2;S.board[r2][c2].el.dataset.c=c2;
    boardEl.classList.add('shake');
    setTimeout(function(){boardEl.classList.remove('shake')},300);
    await wait(250);
    S.isProcessing=false;
    return;
  }
  S.moves--;
  updateUI();
  await processCascade();
  updateUI();
  checkLevelEnd();
  S.isProcessing=false;
}

function useHammer(r,c){
  if(S.powerups.hammer<=0||S.isProcessing)return;
  S.isProcessing=true;
  S.powerups.hammer--;
  updatePowerupUI();
  Storage.save();
  var ts=tileW();
  var t=S.board[r][c];
  if(!t){S.isProcessing=false;return}
  if(t.el){t.el.style.opacity='0';t.el.style.transform='translate('+(c*ts+6)+'px,'+(r*ts+6)+'px) scale(0)'}
  S.board[r][c]=null;
  Sound.play('pop');
  setTimeout(function(){
    dropAndFill().then(function(){processCascade().then(function(){updateUI();checkLevelEnd();S.isProcessing=false;Storage.save()})});
  },280);
  S.hammerMode=false;
  $('hammer-btn').classList.remove('active');
}

function useShuffle(){
  if(S.powerups.shuffle<=0||S.isProcessing)return;
  S.isProcessing=true;
  S.powerups.shuffle--;
  updatePowerupUI();
  Storage.save();
  var types=[];
  for(var r=0;r<S.rows;r++)for(var c=0;c<S.cols;c++)if(S.board[r][c])types.push(S.board[r][c].type);
  types.sort(function(){return Math.random()-.5});
  var idx=0;
  for(var r=0;r<S.rows;r++)for(var c=0;c<S.cols;c++)if(S.board[r][c]){
    S.board[r][c].type=types[idx++];S.board[r][c].special=null;
    if(S.board[r][c].el){
      S.board[r][c].el.className='tile t'+S.board[r][c].type;
      S.board[r][c].el.innerHTML='<div class="tile-bg"></div><div class="tile-emoji">'+EMOJIS[S.board[r][c].type]+'</div>';
    }
  }
  Sound.play('swap');
  S.isProcessing=false;
}

function checkLevelEnd(){
  if(S.objective.type==='score'&&S.score>=S.objective.target){
    S.moves=0;endLevel(true);return;
  }
  if(S.objective.type==='collect'&&(S.collected[S.objective.tileType]||0)>=S.objective.target){
    S.moves=0;endLevel(true);return;
  }
  if(S.moves<=0){
    var pass=false;
    if(S.objective.type==='score'&&S.score>=S.objective.target)pass=true;
    if(S.objective.type==='collect'&&(S.collected[S.objective.tileType]||0)>=S.objective.target)pass=true;
    endLevel(pass);
  }
}

function endLevel(pass){
  if(pass){
    Sound.play('win');
    if(S.level>=S.unlockedLevel)S.unlockedLevel=S.level+1;
    var stars=1;
    if(S.score>=LEVELS[S.level-1].starScores[1])stars=2;
    if(S.score>=LEVELS[S.level-1].starScores[2])stars=3;
    var old=S.stars[S.level]||0;
    if(stars>old)S.stars[S.level]=stars;
    var hs=S.highScores[S.level]||0;
    if(S.score>hs)S.highScores[S.level]=S.score;
    if(stars===3){S.powerups.hammer++;S.powerups.shuffle++;updatePowerupUI()}
    Storage.save();
    $('complete-score').textContent=S.score;
    $('complete-best').textContent=S.highScores[S.level];
    ['star1','star2','star3'].forEach(function(id,i){$(id).classList.remove('filled')});
    $('complete-modal').classList.add('active');
    setTimeout(function(){
      if(stars>=1){$('star1').classList.add('filled');Sound.play('star')}
    },300);
    if(stars>=2)setTimeout(function(){$('star2').classList.add('filled');Sound.play('star')},600);
    if(stars>=3)setTimeout(function(){$('star3').classList.add('filled');Sound.play('star')},900);
  }else{
    Sound.play('lose');
    $('failed-score').textContent=S.score;
    $('failed-modal').classList.add('active');
  }
}

function updateUI(){
  $('score').textContent=S.score;
  $('moves').textContent=Math.max(S.moves,0);
  $('level-num').textContent=S.level;
  var obj=S.objective;
  if(obj.type==='score'){
    $('objective-text').textContent='目标分数: '+obj.target;
    $('progress-fill').style.width=Math.min(100,S.score/obj.target*100)+'%';
  }else{
    var col=S.collected[obj.tileType]||0;
    $('objective-text').textContent='收集 '+EMOJIS[obj.tileType]+': '+col+'/'+obj.target;
    $('progress-fill').style.width=Math.min(100,col/obj.target*100)+'%';
  }
}

function updatePowerupUI(){
  $('hammer-count').textContent=S.powerups.hammer;
  $('shuffle-count').textContent=S.powerups.shuffle;
  $('hammer-btn').classList.toggle('disabled',S.powerups.hammer<=0);
  $('shuffle-btn').classList.toggle('disabled',S.powerups.shuffle<=0);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
  $(name+'-screen').classList.add('active');
  S.screen=name;
  if(name==='menu')Music.stop();
}

function renderLevelMap(){
  var container=$('map-container'),nodes=$('level-nodes'),svg=$('vine-svg');
  nodes.innerHTML='';svg.innerHTML='';
  var spacing=85,mapW=container.clientWidth,centerX=mapW/2,amp=Math.min(mapW/3,90),positions=[];
  for(var i=0;i<TOTAL;i++){positions.push({x:centerX+Math.sin(i*.8)*amp,y:60+i*spacing})}
  var d='M '+positions[0].x+' '+positions[0].y;
  for(var i=1;i<positions.length;i++){
    var p=positions[i-1],cur=positions[i];
    d+=' C '+p.x+' '+((p.y+cur.y)/2)+', '+cur.x+' '+((p.y+cur.y)/2)+', '+cur.x+' '+cur.y;
  }
  var h=60+TOTAL*spacing;
  svg.setAttribute('width',mapW);svg.setAttribute('height',h);
  nodes.style.height=h+'px';
  var bp=document.createElementNS('http://www.w3.org/2000/svg','path');
  bp.setAttribute('d',d);bp.setAttribute('stroke','#0d3d0d');bp.setAttribute('stroke-width','10');bp.setAttribute('fill','none');bp.setAttribute('stroke-linecap','round');
  svg.appendChild(bp);
  var fp=document.createElementNS('http://www.w3.org/2000/svg','path');
  fp.setAttribute('d',d);fp.setAttribute('stroke','#4cae4c');fp.setAttribute('stroke-width','5');fp.setAttribute('fill','none');fp.setAttribute('stroke-linecap','round');
  svg.appendChild(fp);
  for(var i=0;i<TOTAL;i++){
    var lv=i+1,pos=positions[i],unlocked=lv<=S.unlockedLevel;
    var node=document.createElement('div');
    node.className='level-node'+(unlocked?'':' locked');
    node.style.left=pos.x+'px';node.style.top=pos.y+'px';
    var starsHtml='';
    var st=S.stars[lv]||0;
    for(var s=0;s<st;s++)starsHtml+='⭐';
    if(starsHtml)node.innerHTML='<div class="level-circle"><span>'+lv+'</span></div><div class="level-stars">'+starsHtml+'</div>';
    else node.innerHTML='<div class="level-circle"><span>'+lv+'</span></div>';
    if(unlocked){
      (function(l){node.onclick=function(){showLevelInfo(l)}})(lv);
    }
    nodes.appendChild(node);
  }
}

function showLevelInfo(lv){
  S.level=lv;
  var lvData=LEVELS[lv-1];
  $('info-level-title').textContent='第 '+lv+' 关';
  if(lvData.objective.type==='score')$('info-objective').textContent='目标: 达到 '+lvData.objective.target+' 分';
  else $('info-objective').textContent='目标: 收集 '+(12+lv)+' 个 '+EMOJIS[lvData.objective.tileType];
  $('info-moves').textContent=lvData.moves;
  $('info-best').textContent=S.highScores[lv]||'-';
  $('level-info-modal').classList.add('active');
}

function startLevel(){
  var lvData=LEVELS[S.level-1];
  S.rows=lvData.rows;S.cols=lvData.cols;S.tileTypes=lvData.tileTypes;
  S.moves=lvData.moves;S.score=0;S.combo=0;S.maxCombo=0;
  S.objective=lvData.objective;S.collected={};S.selected=null;S.hammerMode=false;
  S.isProcessing=false;
  initBoard();
  renderBoard();
  updateBoardSize();
  renderPositions();
  updateUI();
  updatePowerupUI();
  showScreen('game');
  Music.start();
}

// ===== INPUT =====
var touchStart=null,touchTile=null;

function getTileFromPos(x,y){
  var rect=boardEl.getBoundingClientRect();
  var ts=tileW();
  var c=Math.floor((x-rect.left-6)/ts);
  var r=Math.floor((y-rect.top-6)/ts);
  if(r>=0&&r<S.rows&&c>=0&&c<S.cols)return{r:r,c:c};
  return null;
}

// Use pointer events for unified mouse/touch
function onDown(x,y){
  if(S.isProcessing)return;
  if(S.hammerMode){
    var pos=getTileFromPos(x,y);
    if(pos&&S.board[pos.r][pos.c])useHammer(pos.r,pos.c);
    return;
  }
  var pos=getTileFromPos(x,y);
  if(!pos)return;
  touchStart={x:x,y:y};
  touchTile=pos;
}

function onMove(x,y){
  if(!touchStart||S.isProcessing||!touchTile)return;
  var dx=x-touchStart.x,dy=y-touchStart.y,ts=tileW();
  if(Math.abs(dx)<ts*.4&&Math.abs(dy)<ts*.4)return;
  var dr=0,dc=0;
  if(Math.abs(dx)>Math.abs(dy)){dc=dx>0?1:-1}else{dr=dy>0?1:-1}
  var r1=touchTile.r,c1=touchTile.c,r2=r1+dr,c2=c1+dc;
  touchStart=null;touchTile=null;
  trySwap(r1,c1,r2,c2);
}

function onUp(){
  if(!touchStart||!touchTile){touchStart=null;touchTile=null;return}
  if(S.isProcessing){touchStart=null;touchTile=null;return}
  var pos=touchTile;touchStart=null;touchTile=null;
  if(S.selected){
    var sel=S.selected;
    if(sel.r===pos.r&&sel.c===pos.c){
      var t=S.board[sel.r][sel.c];
      if(t&&t.el)t.el.classList.remove('selected');
      S.selected=null;return;
    }
    var dr=pos.r-sel.r,dc=pos.c-sel.c;
    if((Math.abs(dr)===1&&dc===0)||(dr===0&&Math.abs(dc)===1)){
      var t2=S.board[sel.r][sel.c];
      if(t2&&t2.el)t2.el.classList.remove('selected');
      S.selected=null;
      trySwap(sel.r,sel.c,pos.r,pos.c);
      return;
    }
    var t3=S.board[sel.r][sel.c];
    if(t3&&t3.el)t3.el.classList.remove('selected');
    S.selected=pos;
    var t4=S.board[pos.r][pos.c];
    if(t4&&t4.el)t4.el.classList.add('selected');
  }else{
    S.selected=pos;
    var t5=S.board[pos.r][pos.c];
    if(t5&&t5.el)t5.el.classList.add('selected');
  }
}

// Mouse
boardEl.addEventListener('mousedown',function(e){onDown(e.clientX,e.clientY)});
boardEl.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY)});
boardEl.addEventListener('mouseup',function(e){onUp()});
boardEl.addEventListener('mouseleave',function(e){onUp()});

// Touch - use passive:false for preventDefault
boardEl.addEventListener('touchstart',function(e){
  e.preventDefault();
  var t=e.touches[0];
  onDown(t.clientX,t.clientY);
},{passive:false});
boardEl.addEventListener('touchmove',function(e){
  if(!touchStart)return;
  e.preventDefault();
  var t=e.touches[0];
  onMove(t.clientX,t.clientY);
},{passive:false});
boardEl.addEventListener('touchend',function(e){
  e.preventDefault();
  onUp();
},{passive:false});

// Buttons - use click (with touch-action:manipulation removes 300ms delay)
$('play-btn').onclick=function(){Sound.play('click');if(!Sound.ctx)Sound.init();showScreen('map');renderLevelMap()};
$('settings-btn').onclick=function(){Sound.play('click');$('sound-toggle').checked=S.soundEnabled;$('music-toggle').checked=S.musicEnabled;$('settings-modal').classList.add('active')};
$('settings-close-btn').onclick=function(){Sound.play('click');S.soundEnabled=$('sound-toggle').checked;S.musicEnabled=$('music-toggle').checked;Storage.save();$('settings-modal').classList.remove('active');if(!S.musicEnabled)Music.stop()};
$('reset-progress-btn').onclick=function(){if(confirm('确定要重置所有进度吗？')){Storage.reset();updatePowerupUI();$('settings-modal').classList.remove('active');showScreen('menu')}};
$('map-back-btn').onclick=function(){Sound.play('click');showScreen('menu')};
$('game-back-btn').onclick=function(){Sound.play('click');Music.stop();showScreen('map');renderLevelMap()};
$('info-start-btn').onclick=function(){Sound.play('click');$('level-info-modal').classList.remove('active');startLevel()};
$('info-close-btn').onclick=function(){Sound.play('click');$('level-info-modal').classList.remove('active')};
$('next-level-btn').onclick=function(){Sound.play('click');$('complete-modal').classList.remove('active');S.level++;startLevel()};
$('replay-btn').onclick=function(){Sound.play('click');$('complete-modal').classList.remove('active');startLevel()};
$('complete-map-btn').onclick=function(){Sound.play('click');$('complete-modal').classList.remove('active');showScreen('map');renderLevelMap()};
$('retry-btn').onclick=function(){Sound.play('click');$('failed-modal').classList.remove('active');startLevel()};
$('failed-map-btn').onclick=function(){Sound.play('click');$('failed-modal').classList.remove('active');showScreen('map');renderLevelMap()};

$('hammer-btn').onclick=function(){
  if(S.powerups.hammer<=0||S.isProcessing)return;
  Sound.play('click');
  S.hammerMode=!S.hammerMode;
  $('hammer-btn').classList.toggle('active',S.hammerMode);
  if(S.hammerMode&&S.selected){
    var t=S.board[S.selected.r][S.selected.c];
    if(t&&t.el)t.el.classList.remove('selected');
    S.selected=null;
  }
};
$('shuffle-btn').onclick=function(){Sound.play('click');useShuffle()};

window.addEventListener('resize',function(){updateBoardSize();if(S.screen==='map')renderLevelMap()});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

// Init audio on first interaction
document.addEventListener('click',function(){if(!Sound.ctx)Sound.init()},{once:true});
document.addEventListener('touchstart',function(){if(!Sound.ctx)Sound.init()},{once:true});

// Start
Storage.load();
updateBoardSize();
updatePowerupUI();
</script>
